<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial Clínico | DermaVida</title>
    <link rel="icon" href="../img/logo.svg">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body data-pagina="consultas" data-titulo="Historial Clínico" data-roles="Administrador,Dermatólogo">
<main>
    <div class="page-head">
        <div><h2>📋 Historial Clínico</h2><p>Consultas registradas con diagnóstico, tratamiento y receta.</p></div>
    </div>
    <div class="card">
        <div class="filters" style="margin-bottom:14px">
            <div class="field grow"><label for="buscar">Buscar</label>
                <div class="input-icon"><span>🔍</span><input class="input" id="buscar" placeholder="Paciente, cédula o diagnóstico..."></div></div>
            <div class="field"><label for="fDesde">Desde</label><input class="input" type="date" id="fDesde"></div>
            <div class="field"><label for="fHasta">Hasta</label><input class="input" type="date" id="fHasta"></div>
        </div>
        <div class="table-wrap"><table class="table responsive" id="tabla"><thead></thead><tbody></tbody></table></div>
        <div class="table-info" id="infoTabla"></div>
    </div>
</main>

<script src="../js/api.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/crud.js"></script>
<script src="../js/consultas.js"></script>
</body>
</html>
