<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicios | DermaVida</title>
    <link rel="icon" href="../img/logo.svg">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body data-pagina="servicios" data-titulo="Servicios" data-roles="Administrador,Recepción,Dermatólogo">
<main>
    <div class="page-head">
        <div><h2>✨ Catálogo de Servicios</h2><p>Procedimientos, precios y duración (la duración define los bloques de la agenda).</p></div>
        <div class="toolbar"><button class="btn btn-primary" id="btnNuevo">➕ Nuevo servicio</button></div>
    </div>
    <div class="card">
        <div class="filters" style="margin-bottom:14px">
            <div class="field grow"><label for="buscar">Buscar</label>
                <div class="input-icon"><span>🔍</span><input class="input" id="buscar" placeholder="Nombre del servicio..."></div></div>
            <div class="field"><label for="filtroCategoria">Categoría</label><select class="input" id="filtroCategoria"><option value="">Todas</option><option>Clínica</option><option>Diagnóstica</option><option>Quirúrgica</option><option>Estética</option></select></div>
        </div>
        <div class="table-wrap"><table class="table responsive" id="tabla"><thead></thead><tbody></tbody></table></div>
        <div class="table-info" id="infoTabla"></div>
    </div>
</main>

<script src="../js/api.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/crud.js"></script>
<script src="../js/servicios.js"></script>
</body>
</html>
